# Ambiente local: Postgres (dev), Postgres (teste) e armazenamento S3 (RustFS).
# Suba com: docker compose up -d
#
# Por que RustFS e não MinIO: a imagem minio/minio foi removida do Docker Hub.
# O RustFS expõe a mesma API S3; o código do app (AWS SDK) é idêntico ao usado no Cloudflare R2.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fecharota
      POSTGRES_PASSWORD: fecharota
      POSTGRES_DB: fecharota_dev
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fecharota -d fecharota_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

  db_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fecharota
      POSTGRES_PASSWORD: fecharota
      POSTGRES_DB: fecharota_test
    ports:
      - "5433:5432"
    # Banco de teste é descartável: fica em memória.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fecharota -d fecharota_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  storage:
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY: fecharota
      RUSTFS_SECRET_KEY: fecharota-secret
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
    ports:
      - "9000:9000"
    volumes:
      - storage_data:/data

  # Cria os buckets de dev e de teste na subida (idempotente) e encerra.
  storage_init:
    image: amazon/aws-cli:2.40.4
    depends_on:
      - storage
    environment:
      AWS_ACCESS_KEY_ID: fecharota
      AWS_SECRET_ACCESS_KEY: fecharota-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do
          aws --endpoint-url http://storage:9000 s3api list-buckets >/dev/null 2>&1 && break
          sleep 1
        done
        for b in fecharota-dev fecharota-test; do
          aws --endpoint-url http://storage:9000 s3api head-bucket --bucket $$b 2>/dev/null \
            || aws --endpoint-url http://storage:9000 s3api create-bucket --bucket $$b
        done
        aws --endpoint-url http://storage:9000 s3api list-buckets --query 'Buckets[].Name' --output text

volumes:
  db_data:
  storage_data:
